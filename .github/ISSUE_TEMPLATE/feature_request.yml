name: Feature request
description: Describe a concrete convergence-testing need.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What task cannot be completed with the current scenarios or adapter protocol?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Include acceptance criteria and relevant platform constraints. Keep the local-tool scope in mind.
    validations:
      required: true
